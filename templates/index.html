<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chatbot</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <div>
                    
                    <h1>Ask Jayesh</h1>
                    <p class="eyebrow">Your Smart Advisor</p>
                </div>
            </div>
            <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☾</span>
                <span class="theme-label">Dark mode</span>
            </button>
        </header>

        <section id="messages" aria-live="polite" aria-label="Conversation">
            <div class="empty-state">
                <span class="empty-icon" aria-hidden="true">✦</span>
                <h2>How can I help?</h2>
                <p>Ask a question to start a conversation.</p>
            </div>
        </section>

        <form id="chat-form">
            <label class="sr-only" for="message-input">Your message</label>
            <input id="message-input" type="text" placeholder="Ask anything..." autocomplete="off" required>
            <button id="send-button" type="submit">
                <span>Send message</span>
                <span class="send-icon" aria-hidden="true">↑</span>
            </button>
        </form>
    </main>
    
    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("send-button");
        const themeToggle = document.getElementById("theme-toggle");
        const themeIcon = themeToggle.querySelector(".theme-icon");
        const themeLabel = themeToggle.querySelector(".theme-label");
        const emptyState = document.querySelector(".empty-state");

        function setTheme(theme) {
            const isDark = theme === "dark";
            document.documentElement.dataset.theme = isDark ? "dark" : "light";
            themeToggle.setAttribute("aria-pressed", String(isDark));
            themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
            themeIcon.textContent = isDark ? "☀" : "☾";
            themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
            localStorage.setItem("theme", theme);
        }

        const savedTheme = localStorage.getItem("theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        setTheme(savedTheme || preferredTheme);

        themeToggle.addEventListener("click", () => {
            const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            setTheme(nextTheme);
        });

        function addMessage(sender, text) {
            emptyState?.remove();
            const paragraph = document.createElement("p");
            paragraph.className = `message ${sender.toLowerCase() === "you" ? "user" : "bot"}`;
            paragraph.textContent = `${sender}: ${text}`;
            messages.appendChild(paragraph);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage("You", message);
            input.value = "";
            sendButton.disabled = true;
            sendButton.querySelector("span:first-child").textContent = "Sending...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage("Bot", data.response);
                } else {
                    addMessage("Bot", data.error || "Something went wrong");
                }
            } catch (error) {
                addMessage("Bot", "Unable to reach the assistant. Please try again.");
            } finally {
                sendButton.disabled = false;
                sendButton.querySelector("span:first-child").textContent = "Send message";
                input.focus();
            }
        });
    </script>
</body>
</html>
